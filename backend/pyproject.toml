[project]
name = "justdump-backend"
version = "0.1.0"
description = "Authenticated text-note API for JustDump Milestone 3A"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.10,<3",
    "openai>=2.0,<3",
    "tiktoken>=0.8,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
